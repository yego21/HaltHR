{% extends "base.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        .carousel-item {
            background-size: cover;
            height: 100vh;
            position: absolute;
            width: 100%;
        }

        .carousel-item.active {
            position: relative;
            z-index: 1;
        }

        .carousel-item:not(.active) {
            z-index: 0;
        }

        .hero {
            position: relative;
            height: 100vh;
        }

        /* Login form responsive positioning */
        .login-form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 10px;
            color: #fff;
            width: 100%;
            max-width: 350px;
            z-index: 2;
        }

        /* Container for form positioning */
        .form-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            z-index: 2;
            padding: 0 1rem;
        }

        /* Desktop positioning - right aligned */
        @media (min-width: 768px) {
            .form-container {
                right: 20rem;
                width: auto;
                padding: 0;
            }

            .login-form {
                max-width: 437px; /* 125% of 350px */
                transform: scale(1.25);
                transform-origin: center;
            }
        }

        /* Mobile positioning - centered */
        @media (max-width: 767px) {
            .form-container {
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                padding: 0 1rem;
            }

            .login-form {
                max-width: 100%;
                padding: 1.5rem;
            }
        }

        /* Small mobile adjustments */
        @media (max-width: 480px) {
            .login-form {
                padding: 1rem;
            }

            .hero {
                min-height: 100vh;
            }
        }
    </style>
</head>

<body>
    <!-- Hero section with carousel background -->
    <div class="hero">
        <div id="backgroundCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">

                {% if hero_images|length > 0 %}
                <!-- Loop through each available hero image -->
                {% for image in hero_images %}
                {% if image and image.url %}
                <div class="carousel-item {% if forloop.first %}active{% endif %}"
                    style="background-image: url('{{ image.url }}');"></div>
                {% endif %}
                {% endfor %}
                {% else %}
                <!-- Show default image if no hero images are available -->
                <div class="carousel-item active" style="background-image: url('{% static "images/hero_default.jpg" %}');"></div>
                {% endif %}

            </div>

            <!-- Optional controls for manual sliding -->
            <button class="carousel-control-prev" type="button" data-bs-target="#backgroundCarousel"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#backgroundCarousel"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- Responsive login form container -->
        <div class="form-container">
            <form class="login-form mx-auto" method="post">
                {% csrf_token %}
                <h2 class="text-center">Login</h2>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Enter your username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

</body>

</html>

{% endblock %}
