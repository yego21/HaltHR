<ul class="dropdown-menu show">
  {% for suggestion in suggestions %}
      <li>
          <a href="{% url 'search_userprofile_with_pk' suggestion.pk %}" class="dropdown-item">
            {{ suggestion }} ({{ suggestion.department }})
          </a>
      </li>
  {% empty %}
      <li class="dropdown-item text-muted">No results found</li>
  {% endfor %}
</ul>
